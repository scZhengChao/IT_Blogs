<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <style>
    .box{
      width: 500px;
      height: 100px;
      margin: 50px auto;
      border: 1px solid black;
      position: relative;
    }
    .targetA{
      height: 20px; 
      position: absolute;
      left: 100%;
      white-space:nowrap;
    } 
    .targetB{
      height: 20px; 
      position: absolute;
      left: 100%;
      white-space:nowrap;
    }
  
  </style>

</head>

<body>
    <div class="box">
        <span class="targetA">我从哪里来，我要到哪里去</span>
        <span class="targetB">我从哪里来，我要到哪里去</span>
    </div>
</body>
<script src="./Tween.min.js"></script>
<script>
  var tarA = document.querySelector('.targetA')
  var tarB = document.querySelector('.targetB')
  
  const positionB  = {x:tarB.offsetLeft}
  var tweenA
  function begin(){
    const positionA = {x:tarA.offsetLeft}
    tweenA = new TWEEN.Tween(positionA).to({ x: -tarA.clientWidth }, 8000)
    .onUpdate(function(){ 
      tarA.style.left = positionA.x +'px'
    })
    tweenA.start();
    // tweenB.start();
    // tweenA.chain(tweenB);
    tweenA.repeat(Infinity); // repeats forever
    animate();
    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();
    }
  }
  begin()
  var tweenB = new TWEEN.Tween(positionB).to({ x: -tarB.clientWidth }, 8000)
  .onUpdate(function(){ 
    tarB.style.left = positionB.x +'px'
  })
 
  var box = document.querySelector('.box')
  box.onmouseenter = function(){
    tweenA.stop()
  }
  box.onmouseleave = function(){
    begin()
  }
  
</script>

</html>
