<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../public/css/reset.css">
    <script src="../../public/vue/vue2.6.10.js"></script>
    <link rel="stylesheet" href="../../public/element-ui/index.css">
    <script src="../../public/element-ui/index.js"></script>
    <style>
        #app{
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .stage{
            height: 30px;
            overflow: hidden;
            margin: 50px auto;
            border: 1px solid black;
        }
        .inner-container {
            animation: myMove 5s linear infinite;
            animation-fill-mode: forwards;
        }
        p{
            height: 30px;
        }
        /*文字无缝滚动*/
        @keyframes myMove {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-150px);
            }
        }

    </style>
</head>

<body>
    <div id='app'>
            <el-button  @click='bl=!bl' type='primary'>transition</el-button>
            <div class="stage">
                <div class="inner-container">
                    <p class="text" v-for="(text, index) in arr" :key="index">{{text}}</p>
                </div>
            </div>
            
    </div>
</body>
<script>
    const vm = new Vue({
        el:'#app',
        data:{
            arr: [
                '1 不是被郭德纲发现的，也不是一开始就收为徒弟。',
                '2 现在雅阁这个状态像极了新A4L上市那段日子。',
                '3 低配太寒碜，各种需要加装，中配定价过高，又没啥特色',
                '4 然后各种机油门、经销商造反什么的幺蛾子。',
                '5 看五月销量，建议参考A4，打8折吧。', 
                '1 不是被郭德纲发现的，也不是一开始就收为徒弟。', 
            ],
        },
        methods:{
    
        },
        computed: {
            buttonMessage: function () {
                switch (this.docState) {
                case 'saved': return 'Edit'
                case 'edited': return 'Save'
                case 'editing': return 'Cancel'
                }
            }
        }
    })
</script>
</html>
