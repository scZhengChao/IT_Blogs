  <style type="text/css">
    @keyframes hah {
      from{  }
      to{ transform: translate3d(-600px,0,0) }
    }
    @keyframes mar {
      from{  }
      to{ transform: translate3d(calc(-100vw - 100%),0,0) }
    }
    .box{
      width: 80%;
      height: 100px;
      margin: 50px auto;
      border: 1px solid black;
      position: relative;
      box-sizing: border-box;
      /* overflow: hidden; */
    }
    .targetB{
      height: 20px; 
      position: absolute;
      white-space:nowrap;
      left: 100%;
      animation: mar 5s linear infinite;
    }
    
  </style>
  <style class="marquee">
  
  </style>

</head>
