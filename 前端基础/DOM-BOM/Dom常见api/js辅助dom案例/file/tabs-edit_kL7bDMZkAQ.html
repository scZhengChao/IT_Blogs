<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../public/vue/vue2.6.10.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        #app{
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .checkbox .el-checkbox__inner{
            border-radius: 50%;
        }
        .el-icon-close{
            border-radius: 50%;
            background: #409EFF;
            color: white;
            right: 0;
        }
        #app .el-tabs__item .el-icon-close:hover{
            background-color: #409EFF;
            color:white
        }
        #app .el-tabs__item{
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<body>
    <div id='app'>
        <div v-editor>
            title 可编辑
        </div>
        <div style="margin-bottom: 20px;">
            <el-button
              size="small"
              @click="addTab(editableTabsValue)"
            >
              add tab
            </el-button>
          </div>
          <el-tabs v-model="editableTabsValue" type="card" closable @tab-remove="removeTab" tab-position="left">
            <el-tab-pane
              v-for="(item, index) in editableTabs"
              :key="item.name"
              :name="item.name"
            >
            <el-checkbox  slot="label" class="checkbox">{{item.title}}</el-checkbox>
              {{item.content}}
            </el-tab-pane>
          </el-tabs>
           
    </div>
</body>
<script>
    const vm = new Vue({
        el:'#app',
        data:{
            editableTabsValue: '2',
            editableTabs: [
                {
                    title: 'Tab 1',
                    name: '1',
                    content: 'Tab 1 content'
                }, 
                {
                    title: 'Tab 2',
                    name: '2',
                    content: 'Tab 2 content'
                }
            ],
            tabIndex: 2
        },
        directives:{
            editor:{
                inserted:function(element){
                    
                    let fneditor = function(){
                        // 过滤下可点击元素
                        if(e.target.className.indexOf('list-group-item') == -1) return
                        var oldhtml = element.innerHTML;
                        console.log(oldhtml)
                        //创建新的input元素
                        var newobj = document.createElement('input');
                        //为新增元素添加类型
                        newobj.type = 'text';
                        //为新增元素添加value值
                        newobj.value = oldhtml;
                        // 限制长度
                        newobj.maxLength = 5
                        
                        //为新增元素添加光标离开事件
                        newobj.onblur = function() {
                            //当触发时判断新增元素值是否为空，为空则不修改，并返回原有值 
                            element.innerHTML = this.value == '' ? oldhtml : this.value;
                            //当触发时设置父节点的双击事件为ShowElement
                            element.addEventListener('dblclick',fneditor)
                        }
                        //设置该标签的子节点为空
                        element.innerHTML = '';
                        //添加该标签的子节点，input对象
                        element.appendChild(newobj);
                    
                        //设置获得光标
                        newobj.focus();

                        //设置父节点的双击事件为空
                        element.removeEventListener("dblclick", fneditor);
                    }
                    element.addEventListener('dblclick',fneditor,true)
                }
            } 
        },
        methods:{
            addTab(targetName) {
                let newTabName = ++this.tabIndex + '';
                this.editableTabs.push({
                title: 'New Tab',
                name: newTabName,
                content: 'New Tab content'
                });
                this.editableTabsValue = newTabName;
            },
            removeTab(targetName) {
                let tabs = this.editableTabs;
                let activeName = this.editableTabsValue;
                if (activeName === targetName) {
                tabs.forEach((tab, index) => {
                    if (tab.name === targetName) {
                    let nextTab = tabs[index + 1] || tabs[index - 1];
                    if (nextTab) {
                        activeName = nextTab.name;
                    }
                    }
                });
                }
                
                this.editableTabsValue = activeName;
                this.editableTabs = tabs.filter(tab => tab.name !== targetName);
            }
    
        }
        
    })
</script>
</html>
