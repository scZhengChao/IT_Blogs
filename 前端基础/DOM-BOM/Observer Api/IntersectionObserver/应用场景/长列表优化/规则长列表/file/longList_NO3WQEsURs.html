<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../public/vue/vue2.6.10.js"></script>
    <link rel="stylesheet" href="../public/element-ui/index.css">
    <script src="../public/element-ui/index.js"></script>
    <script src="https://polyfill.io/v2/polyfill.min.js?features=IntersectionObserver"></script>
    <style>
        .wrap{
            height: 200px;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid black;
        }
        .list{
            margin: 0;
        }
        .list li {
            height: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="wrap">
            <ul class="list" :style="styleObject">
                <li v-for='(item,index) of renderData' :key="index" :class="{'firstItem':index==0,'lastItem':index == 19}">{{item}}</li>
            </ul>
        </div>
        
    </div>
</body>
<script>
    let arr  = []
    for(var i = 0 ; i <1000 ;i ++ ){
        arr.push(i)
    }
    let vm = new Vue({
        el:"#app",
        data:{
            list:arr,
            firstItem:null,
            lastItem:null,
            currentIndex:0,
            scrollTop:null,
            scrollDirection:null,
            paddingBottom:0,
            paddingTop:0,
            disabled:false,
            
        },
        created:function(){
         
        },
        computed:{
            styleObject(){
                return {
                    paddingTop:this.paddingTop+ "px",
                    paddingBottom:this.paddingBottom+"px"
                }
            },
            renderData(){
                let arr = this.list.slice(this.currentIndex*10,this.currentIndex*10+20)
                console.log('computed:',arr)
                return arr
            }
        },
        mounted:function(){
            this.observer = new IntersectionObserver(this.done, {});
            this.firstItem = document.querySelector('.firstItem')
            this.lastItem = document.querySelector('.lastItem')
            this.observer.observe(this.firstItem);
            this.observer.observe(this.lastItem);
            this.scrollTop = document.querySelector('.wrap').scrollTop
            document.querySelector('.wrap').addEventListener('scroll',this.scroll)
        },
        methods: {
            scroll:function(e){
             if(this.scrollTop < e.target.scrollTop){
                // 向下滚动了
                this.scrollDirection = 'down'
             }else if(this.scrollTop > e.target.scrollTop){
                // 向上滚动了
                this.scrollDirection ='up'
             }
             this.scrollTop = e.target.scrollTop
            },
            done:function(entries){
                let that = this
                entries.forEach(function(entry){
                    if (entry.target.className === 'firstItem') {
                        // 当第一个元素进入视窗
                        that.scrollUp()
                    } else if (entry.target.className === 'lastItem') {
                        // 当最后一个元素进入视窗
                        that.scrollDown()
                    }
                });
            },
            scrollUp(){
                if(this.scrollDirection === 'up'){
                    if(this.disabled) return
                    this.disabled = true
                    console.log('向上滚动加载')
                    this.currentIndex = this.currentIndex - 1
                    this.paddingBottom = this.paddingBottom + 200;
                    if (this.paddingTop === 0) {
                        this.paddingTop = 0;
                    } else {
                        // 如果原来有paddingTop则减去，会有滚动到顶部的元素进行替代
                        this.paddingTop = this.paddingTop - 200;
                    }
                    this.$nextTick(()=>{
                        this.disabled = false
                    })
                }
            },
            scrollDown(){
                if(this.scrollDirection === 'down'){
                    console.log('向下滚动加载')
                    if(this.disabled) return
                    this.disabled = true
                    this.currentIndex = this.currentIndex + 1
                    this.paddingTop = this.paddingTop + 200
                    if (this.paddingBottom == 0) {
                        this.paddingBottom = 0;
                    } else {
                        // 如果原来有paddingBottom则减去，会有滚动到底部的元素进行替代
                        this.paddingBottom = this.paddingBottom - 200;
                    }
                    this.$nextTick(()=>{
                        this.disabled = false
                    })
                }
            }
        }
    })
</script>
</html>
