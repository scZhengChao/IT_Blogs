<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../public/css/reset.css">
    <script src="../../public/vue/vue2.6.10.js"></script>
    <link rel="stylesheet" href="../../public/element-ui/index.css">
    <script src="../../public/element-ui/index.js"></script>
    <style>
        #app{
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .test{
            display: flex;
            flex-direction: column;
            width: 200px;
            height: 50px;
        }
        .box{
            width: 200px;
            height: 50px;
            position: absolute;
            transition: all 1s ease;
            z-index: 100;
            top: 0;
        }
        .box1{
            background: red;
        }
        .box2{
            background: blue;
        }
        .stage{ 
            position: relative;
            top: 200px;
            left: 100px;
            flex: 1;
            overflow: hidden;
            border: 1px solid black;
        }
        .up-enter{
            top: 100%;
        }
        .up-leave-to{
            top: -100%;
        }
        .keytranslate-enter{
            transform: translate3d(100%,0,0);
        }
        .keytranslate-enter-active,.keytranslate-leave-active{
            transition: all .6s;
            position: absolute;
        }
        .keytranslate-leave-to{
            transform: translate3d(-100%,0,0);
        }
    </style>
</head>

<body>
    <div id='app'>
            <el-button  @click='bl=!bl' type='primary'>transition</el-button>
            <div class="test" :id='id'>
                <div class="stage">
                    <transition
                        name='up'
                    >
                        <div class="box box1" v-show='bl'>1</div>
                    </transition>
                    <transition
                        name='up'
                    >
                        <div class="box box2" v-show='!bl'>2</div>
                    </transition>
                </div> 
            </div>
            <el-radio v-model="docState" label="saved">saved</el-radio>
            <el-radio v-model="docState" label="edited">edited</el-radio>
            <el-radio v-model="docState" label="editing">editing</el-radio>
            <transition name='keytranslate'>
                <button v-bind:key="docState" >
                  {{ buttonMessage }}
                </button>
            </transition>
    </div>
</body>
<script>
    const vm = new Vue({
        el:'#app',
        data:{
            bl:true,
            id:'asf',
            docState:'saved'
        },
        methods:{
    
        },
        computed: {
            buttonMessage: function () {
                switch (this.docState) {
                case 'saved': return 'Edit'
                case 'edited': return 'Save'
                case 'editing': return 'Cancel'
                }
            }
        }
    })
</script>
</html>
