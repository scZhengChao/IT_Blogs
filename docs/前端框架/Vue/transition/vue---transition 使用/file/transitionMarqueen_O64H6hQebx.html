<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../public/css/reset.css">
    <script src="../../public/vue/vue2.6.10.js"></script>
    <link rel="stylesheet" href="../../public/element-ui/index.css">
    <script src="../../public/element-ui/index.js"></script>
    <style>
        #app{
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .text-container{
            height: 30px;
            border: 1px solid black;
            overflow: hidden;
        }
        p{
            height: 30px;
            line-height: 30px;
        }
        .slide-enter-active, .slide-leave-active {
            transition: all 0.5s linear;
        }
        .slide-enter-to,.slide-leave{
            transform: translate3d(0,0,0);
        }
        .slide-leave-to {
            transform: translateY(-20px);
        }
        .slide-enter {
            transform: translateY(20px);
        }
        
    </style>
</head>

<body>
    <div id='app'>
            <el-button  @click='bl=!bl' type='primary'>transition</el-button>
            <div class="text-container">
                <transition class="inner-container2" name="slide" mode="out-in">
                  <p class="text2" :key="text.id">{{text.val}}</p>
                </transition>
              </div> 
    </div>
</body>
<script>
    const vm = new Vue({
        el:'#app',
        data:{
            number:0,
            arr: [
                '1 不是被郭德纲发现的，也不是一开始就收为徒弟。',
                '2 现在雅阁这个状态像极了新A4L上市那段日子。',
                '3 低配太寒碜，各种需要加装，中配定价过高，又没啥特色',
                '4 然后各种机油门、经销商造反什么的幺蛾子。',
                '5 看五月销量，建议参考A4，打8折吧。', 
            ],
            totalDuration:1200
        },
        created() {
            this.startMove()
        },
        methods:{
            startMove(totalDuration) {
                let timer = setTimeout(() => {
                    if (this.number === 5) {
                        this.number = 0;
                    } else {
                        this.number += 1;
                    }
                    this.startMove();
                }, this.totalDuration)
            },
        },
        computed: {
            text() {
                return {
                    id: this.number,
                    val: this.arr[this.number]
                }
            }
        },
    })
</script>
</html>
