function Fn(){

    }
    if(!Fn.obj.ele){
        Fn.obj.ele = document.createElement('dialog');
        Fn.obj.ele.innerHTML = '这里是模态框'
    }
    document.body.appendChild(Fn.obj.ele);
    clearTimeout(Fn.obj.timer)
    Fn.obj.timer = setTimeout(() => {
        Fn.obj.ele.style.display = 'none';
    }, 2000);
    Fn.obj.ele.style.display = 'block';
    Fn.obj.name = 'admin';
    this.init();
    return Fn.obj;
}
Fn.prototype.init = function(){
    document.body.style.background = 'red'
