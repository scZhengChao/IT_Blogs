<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../public/vue/vue2.6.10.js"></script>
    <link rel="stylesheet" href="../public/element-ui/index.css">
    <script src="../public/element-ui/index.js"></script>
    <script src="https://polyfill.io/v2/polyfill.min.js?features=IntersectionObserver"></script>
    <style>
        .wrap{
            height: 400px;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid black;
        }
        .list{
            margin: 0;
            padding-left: 0;
        }
        .list li {
            height: 50px;
            list-style: none;
            line-height: 50px;
            text-align: center;
        }
        .list li:nth-child(2n){
            background: gray;
        }
        .list li:nth-child(2n+1){
            background: white;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="wrap">
            <ul class="list" :style="styleObject">
                <li v-for='(item,index) of renderData' :key="index" :class="{'firstItem':index==0,'lastItem':index == 19}">{{item}}</li>
            </ul>
        </div>
        
    </div>
</body>
<script>
    let arr  = []
    for(var i = 0 ; i <1000 ;i ++ ){
        arr.push(i)
    }
    let vm = new Vue({
        el:"#app",
        data:{
            list:arr,
            firstItem:null,
            lastItem:null,
            currentIndex:1,
            scrollDirection:null,
            paddingBottom:0,
            paddingTop:0,
            disabled:false,
            observer:null,
            domDataCache:{
                currentPaddingTop: 0,
                currentPaddingBottom: 0,
                topSentinelPreviousY: 0,
                topSentinelPreviousRatio: 0,
                bottomSentinelPreviousY: 0,
                bottomSentinelPreviousRatio: 0,
                currentIndex: 1
            }
            
        },
        created:function(){
         
        },
        watch:{
            currentIndex:function(a,b){
                console.log(a,'new currentIndex')
            }
        },
        computed:{
            styleObject:function(){
                return {
                    paddingTop:this.paddingTop+ "px",
                    paddingBottom:this.paddingBottom+"px"
                }
            },
            renderData:function(){
                let arr = this.list.slice(this.currentIndex*10,this.currentIndex*10+20)
                return arr
            }
        },
        mounted:function(){
            this.observer = new IntersectionObserver(this.done, {});
            this.firstItem = document.querySelector('.firstItem')
            this.lastItem = document.querySelector('.lastItem')
            this.observer.observe(this.firstItem);
            this.observer.observe(this.lastItem);
        },
        methods: {
            done:function(entries){
                let that = this
                entries.forEach(function(entry){
                    if (entry.target.className === 'firstItem') {
                        // 当第一个元素进入视窗
                        that.scrollUp(entry)
                    } else if (entry.target.className === 'lastItem') {
                        // 当最后一个元素进入视窗
                        that.scrollDown(entry)
                    }
                });
            },
            updateDomDataCache:function(params){
                this.domDataCache =  Object.assign({},this.domDataCache, params);
            },
            changeCurrentIndex:function(isScrollup){
                if(isScrollup){
                    if(this.currentIndex == 0){
                        this.currentIndex = 0
                    }else{
                        this.currentIndex = this.currentIndex - 1
                    }
                }else{
                    this.currentIndex = this.currentIndex + 1
                }
               
            },
            adjustPadding:function(isScrollup){
                if(isScrollup){
                    this.paddingBottom = this.paddingBottom + 500;
                    if (this.paddingTop === 0) {
                        this.paddingTop = 0;
                    } else {
                        // 如果原来有paddingTop则减去，会有滚动到顶部的元素进行替代
                        this.paddingTop = this.paddingTop - 500;
                    }
                }else{
                    this.paddingTop = this.paddingTop + 500
                    if (this.paddingBottom == 0) {
                        this.paddingBottom = 0;
                    } else {
                        // 如果原来有paddingBottom则减去，会有滚动到底部的元素进行替代
                        this.paddingBottom = this.paddingBottom - 500;
                    }

                }
            },
            scrollUp:function(entry){
                // const {topSentinelPreviousY,topSentinelPreviousRatio} = this.domDataCache;
                const topSentinelPreviousY = this.domDataCache.topSentinelPreviousY
                const topSentinelPreviousRatio = this.domDataCache.topSentinelPreviousRatio
                const currentY = entry.boundingClientRect.top;
                const currentRatio = entry.intersectionRatio;
                const isIntersecting = entry.isIntersecting;
                if (currentY > topSentinelPreviousY && isIntersecting  && currentRatio >= topSentinelPreviousRatio) {
                    console.log('topSentCallback.. go');
                    
                    this.changeCurrentIndex(true)
                    //调整paddings
                    this.adjustPadding(true)
                    

                    // 合并缓存
                    this.updateDomDataCache({
                        currentIndex: this.currentIndex,
                        topSentinelPreviousY: currentY,
                        topSentinelPreviousRatio: currentRatio
                    });
                } else {
                    this.updateDomDataCache({
                        topSentinelPreviousY: currentY,
                        topSentinelPreviousRatio: currentRatio
                    });
                }   
            },
            scrollDown:function(entry){
                // const {bottomSentinelPreviousY,bottomSentinelPreviousRatio} = this.domDataCache;
                const bottomSentinelPreviousY = this.domDataCache.bottomSentinelPreviousY
                const bottomSentinelPreviousRatio = this.domDataCache.bottomSentinelPreviousRatio
                const currentY = entry.boundingClientRect.top;
                const currentRatio = entry.intersectionRatio;
                const isIntersecting = entry.isIntersecting;

                if (currentY < bottomSentinelPreviousY && currentRatio >= bottomSentinelPreviousRatio && isIntersecting) {
                    console.log('botSentCallback.. go');
                    
                    this.changeCurrentIndex(false)
                    this.adjustPadding(false)
                    
                    this.updateDomDataCache({
                        currentIndex: this.currentIndex,
                        bottomSentinelPreviousY: currentY,
                        bottomSentinelPreviousRatio: currentRatio
                    });
                } else {
                    this.updateDomDataCache({
                        bottomSentinelPreviousY: currentY,
                        bottomSentinelPreviousRatio: currentRatio
                    });
                }   
            }
        }
    })
</script>
</html>
