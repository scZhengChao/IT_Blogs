<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .btn {
        position: relative;
        margin-left: 100px;
        cursor: pointer;
    }
    .btn:after {
        content: "";
        position: absolute;
        top: -20px;
        right: -20px;
        bottom: -20px;
        left: -20px;
    }
  </style>
</head>

<body>

  <button class="btn">Button</button>




</body>

</html>
