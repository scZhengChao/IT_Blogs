<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 400px;
            height: 100px;
            border: 1px solid black;
            /* position: relative; */
            overflow-x: auto;
            overflow-y: hidden;
           
            box-sizing: border-box;
            margin-right: 0;
            float: left;
            background: green;
            opacity: 0.5;
            
        }
        .box::-webkit-scrollbar{
            display: none;
        }
    
        span{
          height: 40px;
          width: 100px;
          background: red;
          display:inline-block;
          margin-left: 0;
          font-size: 12px;
        }
        .view{
            transition: all .5s ease-in-out;
            white-space: nowrap;
            font-size: 0;
        }
      .scroll{
          transform: translate3d(-100px,0,0);
      }
     .btn{
         float: left;
     }
     
     
    </style>
</head>
<body>
    <input type='button' value='左箭头' class="btn">

        <section class="box">
            <aside class="view">
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
                <span>6</span>
                <span>7</span>
                <span>8</span>
                <span>9</span>
                <span>10</span>

                <span>11</span>
                <span>12</span>
                <span>13</span>
                <span>14</span>
                <span>15</span>
                <span>16</span>
                <span>17</span>
                <span>18</span>
                <span>19</span>
            </aside>
        </section>
        <input type='button' value='右箭头' class="btn1">
                
           
    
</body>
<script>
 var box = document.querySelector('.box')
   var btn = document.querySelector('.btn')
   var btn1 = document.querySelector('.btn1')
   var view = document.querySelector('.view')
   let i = 0;
   function scorll (data){
        let offsetWidth = view.scrollWidth
        let boxwidth = box.offsetWidth
        console.log(offsetWidth)
        console.log(boxwidth)
        i+=data
        if(i>offsetWidth-boxwidth){
            i = offsetWidth-boxwidth
            console.log(i)
        }else if(i<=0){
            i = 0
        }
        view.style.transform = `translate(-${i}px,0)`
   }
 btn.addEventListener('click',function(){
    scorll(500)
 },false)
 btn1.addEventListener('click',function(){
    scorll(-500)
},false)
   </script>
</html>
